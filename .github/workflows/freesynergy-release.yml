name: FreeSynergy — Release OCI Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  oci:
    name: Build & Push OCI Image to FreeSynergy GHCR
    uses: FreeSynergy/fs-ci/.github/workflows/release-oci.yml@main
    with:
      image-name: zentinel
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
